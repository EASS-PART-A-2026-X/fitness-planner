[project]
name = "ai-service"
version = "0.1.0"
description = "Fitness Planner AI coach: a Pydantic AI agent that drafts workout plans"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.57,<3",
    "pydantic-evals>=2.71.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff.lint]
extend-select = ["I", "FAST"]
