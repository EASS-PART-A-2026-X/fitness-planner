<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Rep, the Fitness Planner mascot, waving">
<style>
.bob { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; transform-box: fill-box; }
@keyframes bob { 0%,100% { transform: translateY(0) scale(1.03,.97); } 50% { transform: translateY(-2.5px) scale(.98,1.02); } }
.m-wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.6s ease-in-out infinite; }
@keyframes wave { 25% { transform: rotate(-22deg); } 75% { transform: rotate(14deg); } }
.m-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.m-shadow { transform-box: fill-box; transform-origin: center; animation: shadow 2.6s ease-in-out infinite; }
@keyframes shadow { 50% { transform: scale(.8); opacity: .6; } }
.spark { transform-box: fill-box; transform-origin: center; animation: spark 2.2s ease-in-out infinite; }
@keyframes spark { 0%,100% { opacity: .2; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
</style>
<defs>
  <radialGradient id="glowA" cx="85%" cy="5%" r="70%"><stop offset="0" stop-color="#10B981" stop-opacity=".55"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0%" cy="105%" r="70%"><stop offset="0" stop-color="#3B82F6" stop-opacity=".45"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1729"/><stop offset="1" stop-color="#13203A"/></linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
</defs>
<rect width="220" height="220" rx="48" fill="url(#bg)"/>
<rect width="220" height="220" rx="48" fill="url(#grid)"/>
<rect width="220" height="220" rx="48" fill="url(#glowA)"/>
<rect width="220" height="220" rx="48" fill="url(#glowB)"/>
<rect x=".75" y=".75" width="218.5" height="218.5" rx="47.5" fill="none" stroke="#34D399" stroke-opacity=".3" stroke-width="1.5"/>
<path class="spark" d="M172 46q0 10 10 10-10 0-10 10 0-10-10-10 10 0 10-10z" fill="#FBBF24"/>
<path class="spark" style="animation-delay:.7s" d="M44 60q0 6 6 6-6 0-6 6 0-6-6-6 6 0 6-6z" fill="#5EEAD4"/>
<path class="spark" style="animation-delay:1.3s" d="M180 150q0 5 5 5-5 0-5 5 0-5-5-5 5 0 5-5z" fill="#F97362"/>
<svg x="30" y="26" width="160" height="160" viewBox="0 0 64 64" overflow="visible"><g class="bob"><ellipse class="m-shadow" cx="32" cy="59" rx="13" ry="2.4" fill="rgba(0,0,0,.35)"/><g class="m-bob"><g class=""><path class="m-leg-l" d="M27 48.5v6.5" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/><path class="m-leg-r" d="M37 48.5v6.5" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/></g><rect x="16" y="18" width="32" height="32" rx="16" fill="#10B981"/><ellipse cx="32" cy="41" rx="9" ry="6.5" fill="#6EE7B7" opacity=".55"/><rect x="17" y="22.5" width="30" height="4.2" rx="2.1" fill="#F97362"/><path d="M46 23.5l5-2.5-1.5 4.5 3 2-5 .5z" fill="#F97362"/><g class="m-eyes"><ellipse cx="27" cy="33" rx="2" ry="2.6" fill="#0F172A"/><ellipse cx="37" cy="33" rx="2" ry="2.6" fill="#0F172A"/><circle cx="27.7" cy="32.1" r=".7" fill="#fff"/><circle cx="37.7" cy="32.1" r=".7" fill="#fff"/></g><circle cx="23.4" cy="37.4" r="2.2" fill="#FDA4AF" opacity=".75"/><circle cx="40.6" cy="37.4" r="2.2" fill="#FDA4AF" opacity=".75"/><path d="M29 38.2q3 2.8 6 0" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/><g class=""><path d="M18 38L12 45" stroke="#059669" stroke-width="4" stroke-linecap="round"/><circle cx="12" cy="45" r="2.6" fill="#059669"/></g><g class="m-wave"><path d="M46 34L54 22" stroke="#059669" stroke-width="4" stroke-linecap="round"/><circle cx="54" cy="22" r="2.6" fill="#059669"/></g></g></g></svg>
</svg>
