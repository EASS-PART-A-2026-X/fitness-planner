[project]
name = "backend"
version = "0.1.0"
description = "Fitness Planner FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=9.1.1",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff.lint]
extend-select = ["I", "FAST"]